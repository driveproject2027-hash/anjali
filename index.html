<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>For you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --cream:#FAF9F5; --ink:#141413; --accent:#D97757; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;font-family:Inter,system-ui,sans-serif}
  .wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:
    radial-gradient(ellipse at 50% 30%, #1d1b19 0%, #0c0b0a 70%);
  }
  .card{
    position:relative;
    width:min(86vw, 380px);
    padding:56px 34px 44px;
    text-align:center;
    opacity:0; transform:translateY(16px);
    animation:fadeIn 1.1s cubic-bezier(.16,.8,.3,1) .15s forwards;
  }
  @keyframes fadeIn{to{opacity:1;transform:translateY(0)}}

  .spark{
    width:34px;height:34px;margin:0 auto 22px;opacity:.85;
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.12);opacity:1}}

  .kicker{
    font-family:'Inter',sans-serif;font-weight:500;letter-spacing:3px;text-transform:uppercase;
    color:var(--accent);font-size:11px;margin-bottom:18px;
  }
  .headline{
    font-family:'Playfair Display',serif;font-style:italic;font-weight:600;
    color:var(--cream);font-size:30px;line-height:1.3;margin:0 0 14px;
  }
  .sub{
    font-family:'Inter',sans-serif;color:rgba(250,249,245,.55);font-size:13.5px;line-height:1.6;
    margin:0 0 36px;
  }

  .btn{
    display:inline-flex;align-items:center;gap:10px;
    background:var(--accent);color:var(--cream);
    font-family:'Inter',sans-serif;font-weight:500;font-size:14px;letter-spacing:.3px;
    padding:14px 30px;border-radius:999px;border:none;cursor:pointer;
    box-shadow:0 10px 30px rgba(217,119,87,.35);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .btn:active{transform:scale(.96)}
  .btn svg{transition:transform .25s ease}
  .btn:hover svg{transform:translateX(3px)}

  .leave .card{animation:fadeOut .55s ease forwards}
  @keyframes fadeOut{to{opacity:0;transform:translateY(-10px) scale(.98)}}
  .veil{
    position:fixed;inset:0;background:var(--ink);opacity:0;pointer-events:none;
    transition:opacity .6s ease;
  }
  .leave .veil{opacity:1}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="card">
    <svg class="spark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2L13.8 9.2L21 11L13.8 12.8L12 20L10.2 12.8L3 11L10.2 9.2L12 2Z" fill="#D97757"/>
    </svg>
    <div class="kicker">happy birthday</div>
    <div class="headline">something for you,<br>Anjali.</div>
    <div class="sub">twenty-two looks good on you.<br>this one's worth opening properly.</div>
    <button class="btn" id="openBtn">
      open it
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="veil"></div>
</div>
<script>
document.getElementById('openBtn').addEventListener('click', () => {
  const wrap = document.getElementById('wrap');
  wrap.classList.add('leave');
  setTimeout(() => { window.location.href = 'flipbook.html'; }, 650);
});
</script>
</body>
</html>
